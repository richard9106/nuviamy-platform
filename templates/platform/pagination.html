<nav class="inline-actions" aria-label="Result pages">
{% if page_obj.has_previous %}<a class="btn btn-secondary" href="?q={{ search|urlencode }}&amp;status={{ selected_status|urlencode }}&amp;state={{ selected_state|urlencode }}&amp;action={{ selected_action|urlencode }}&amp;page={{ page_obj.previous_page_number }}">Previous</a>{% endif %}
<span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
{% if page_obj.has_next %}<a class="btn btn-secondary" href="?q={{ search|urlencode }}&amp;status={{ selected_status|urlencode }}&amp;state={{ selected_state|urlencode }}&amp;action={{ selected_action|urlencode }}&amp;page={{ page_obj.next_page_number }}">Next</a>{% endif %}
</nav>

<div class="password-control" data-password-control>
  {{ field }}
  <button type="button" class="password-toggle" data-password-toggle aria-controls="{{ field.id_for_label }}" aria-label="Show {{ field.label|lower }}" aria-pressed="false" data-show-label="Show {{ field.label|lower }}" data-hide-label="Hide {{ field.label|lower }}" hidden>
    <svg data-password-eye viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
    <svg data-password-eye-off viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" hidden><path d="m3 3 18 18M10.6 5.1 12 5c6.5 0 10 7 10 7a20 20 0 0 1-3.1 4M6.2 6.2A21 21 0 0 0 2 12s3.5 7 10 7c1.9 0 3.6-.6 5-1.4M10 10a3 3 0 0 0 4 4"/></svg>
  </button>
</div>

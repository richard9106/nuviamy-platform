# Install as /etc/nginx/conf.d/00-nuviamy-privacy-logging.conf (http context).
# Set each NuviaMy server's access_log to this format, then nginx -t and reload.
# Do not include request_uri, request, args, referer, user_agent or headers here.
log_format nuviamy_privacy '$time_iso8601 method=$request_method status=$status '
                          'bytes=$body_bytes_sent duration=$request_time';

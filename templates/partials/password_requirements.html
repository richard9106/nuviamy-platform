<div class="password-requirements" id="{{ requirements_id }}" data-password-requirements data-password-input="{{ field.id_for_label }}">
  <p class="password-requirements-title">Your password needs:</p>
  <ul>
    <li data-password-rule="length"><span data-password-rule-icon aria-hidden="true">○</span><span class="password-sr-only" data-password-rule-status>Needed: </span>At least {{ minimum_length }} characters</li>
    <li data-password-rule="lowercase"><span data-password-rule-icon aria-hidden="true">○</span><span class="password-sr-only" data-password-rule-status>Needed: </span>A lowercase letter</li>
    <li data-password-rule="uppercase"><span data-password-rule-icon aria-hidden="true">○</span><span class="password-sr-only" data-password-rule-status>Needed: </span>An uppercase letter</li>
    <li data-password-rule="number"><span data-password-rule-icon aria-hidden="true">○</span><span class="password-sr-only" data-password-rule-status>Needed: </span>A number</li>
    <li data-password-rule="special"><span data-password-rule-icon aria-hidden="true">○</span><span class="password-sr-only" data-password-rule-status>Needed: </span>A special character, such as ! @ #</li>
  </ul>
  <p data-password-summary role="status" aria-live="polite" aria-atomic="true">Use a unique password without personal information.</p>
</div>

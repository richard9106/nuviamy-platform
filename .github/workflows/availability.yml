name: Public availability check

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: public-availability
  cancel-in-progress: false

jobs:
  https_health:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check public HTTPS health from outside AWS
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 --retry 2 --retry-delay 5 \
            --output /dev/null https://nuviamy.com/health/
